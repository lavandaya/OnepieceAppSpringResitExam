<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{battles.title}">Battles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<h1 th:text="#{battles.heading}">Battles</h1>

<form th:action="@{/battles}" method="get">
    <label for="location" th:text="#{battles.filter.location}">Location contains:</label>
    <input type="text" id="location" name="location" th:value="${location}">

    <label for="date" th:text="#{battles.filter.date}">Date:</label>
    <input type="date" id="date" name="date" th:value="${date}">

    <button type="submit" th:text="#{button.filter}">Filter</button>
    <a th:href="@{/battles}" th:text="#{button.reset}">Reset</a>
</form>

<table>
    <thead>
    <tr>
        <th th:text="#{battles.table.id}">Id</th>
        <th th:text="#{battles.table.name}">Name</th>
        <th th:text="#{battles.table.location}">Location</th>
        <th th:text="#{battles.table.date}">Date</th>
        <th th:text="#{battles.table.winner}">Winner</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="battle : ${battles}">
        <td th:text="${battle.id}"></td>
        <td th:text="${battle.name}"></td>
        <td th:text="${battle.location}"></td>
        <td th:text="${#temporals.format(battle.date, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${battle.winner}"></td>
    </tr>
    </tbody>
</table>

<p th:text="#{battles.count(${#lists.size(battles)})}">Number of battles: 0</p>
</body>
</html>
