<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${character.name})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="row g-4">
        <div class="col-12 col-md-4">
            <img class="img-fluid rounded shadow-sm character-img" th:src="${character.appearance}"
                 th:alt="${character.name}">
        </div>
        <div class="col-12 col-md-8">
            <h1 th:text="${character.name}">Name</h1>
            <p>
                <span class="badge text-bg-primary" th:text="${character.power} + ' DON'">0 DON</span>
                <span class="badge text-bg-info" th:text="${character.powertype}">TYPE</span>
            </p>
            <table class="table w-auto">
                <tbody>
                <tr>
                    <th th:text="#{characters.table.id}">Id</th>
                    <td th:text="${character.id}"></td>
                </tr>
                <tr>
                    <th th:text="#{characters.table.age}">Age</th>
                    <td th:text="${character.age}"></td>
                </tr>
                </tbody>
            </table>
            <a class="btn btn-outline-secondary" th:href="@{/characters}">
                <i class="bi bi-arrow-left"></i> <span th:text="#{detail.back}">Back to characters</span>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
