<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{characters.title}">Characters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<h1 th:text="#{characters.heading}">Characters</h1>

<form th:action="@{/characters}" method="get">
    <label for="powertype" th:text="#{characters.filter.powertype}">Powertype:</label>
    <select id="powertype" name="powertype">
        <option th:each="pt : ${powertypes}" th:value="${pt}" th:text="${pt}"
                th:selected="${pt == selectedPowertype}"></option>
    </select>
    <button type="submit" th:text="#{button.filter}">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th th:text="#{characters.table.id}">Id</th>
        <th th:text="#{characters.table.name}">Name</th>
        <th th:text="#{characters.table.age}">Age</th>
        <th th:text="#{characters.table.appearance}">Appearance</th>
        <th th:text="#{characters.table.powertype}">Powertype</th>
        <th th:text="#{characters.table.power}">Power</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="character : ${characters}">
        <td th:text="${character.id}"></td>
        <td th:text="${character.name}"></td>
        <td th:text="${character.age}"></td>
        <td th:text="${character.appearance}"></td>
        <td th:text="${character.powertype}"></td>
        <td th:text="${character.power}"></td>
    </tr>
    </tbody>
</table>

<p th:text="#{characters.count(${#lists.size(characters)})}">Number of characters: 0</p>
</body>
</html>
