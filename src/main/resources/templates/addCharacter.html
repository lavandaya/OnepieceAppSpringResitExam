<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{addCharacter.title}">Add Character</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<h1 th:text="#{addCharacter.heading}">Add Character</h1>

<form th:action="@{/characters/add}" method="post">
    <label for="name" th:text="#{addCharacter.label.name}">Name:</label>
    <input type="text" id="name" name="name" required><br>

    <label for="age" th:text="#{addCharacter.label.age}">Age:</label>
    <input type="number" id="age" name="age" min="0" required><br>

    <label for="appearance" th:text="#{addCharacter.label.appearance}">Appearance (image URL):</label>
    <input type="url" id="appearance" name="appearance" required><br>

    <label for="powertype" th:text="#{addCharacter.label.powertype}">Powertype:</label>
    <select id="powertype" name="powertype" required>
        <option th:each="pt : ${powertypes}" th:value="${pt}" th:text="${pt}"></option>
    </select><br>

    <label for="power" th:text="#{addCharacter.label.power}">Power (DON):</label>
    <input type="number" id="power" name="power" step="0.1" min="0" required><br>

    <button type="submit" th:text="#{button.add}">Add</button>
</form>
</body>
</html>
