<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Character</title>
</head>
<body>
<nav>
    <a href="/characters">Character List</a> |
    <a href="/battles">Battle List</a> |
    <a href="/characters/add">Add Character</a> |
    <a href="/battles/add">Add Battle</a>
</nav>

<h1>Add Character</h1>

<form th:action="@{/characters/add}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="0" required><br>

    <label for="appearance">Appearance (image URL):</label>
    <input type="url" id="appearance" name="appearance" required><br>

    <label for="powertype">Powertype:</label>
    <select id="powertype" name="powertype" required>
        <option th:each="pt : ${powertypes}" th:value="${pt}" th:text="${pt}"></option>
    </select><br>

    <label for="power">Power (DON):</label>
    <input type="number" id="power" name="power" step="0.1" min="0" required><br>

    <button type="submit">Add</button>
</form>
</body>
</html>
