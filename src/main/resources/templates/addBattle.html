<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{addBattle.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{addBattle.heading}">Add Battle</h1>

    <form class="needs-validation row g-3" novalidate th:action="@{/battles/add}" method="post">
        <div class="col-md-6">
            <label for="name" class="form-label" th:text="#{addBattle.label.name}">Name:</label>
            <input type="text" class="form-control" id="name" name="name" required>
            <div class="invalid-feedback" th:text="#{validation.required}">Required</div>
        </div>
        <div class="col-md-6">
            <label for="location" class="form-label" th:text="#{addBattle.label.location}">Location:</label>
            <input type="text" class="form-control" id="location" name="location" required>
            <div class="invalid-feedback" th:text="#{validation.required}">Required</div>
        </div>
        <div class="col-md-6">
            <label for="date" class="form-label" th:text="#{addBattle.label.date}">Date and time:</label>
            <input type="datetime-local" class="form-control" id="date" name="date" required>
            <div class="invalid-feedback" th:text="#{validation.required}">Required</div>
        </div>
        <div class="col-md-6">
            <label for="winner" class="form-label" th:text="#{addBattle.label.winner}">Winner:</label>
            <input type="text" class="form-control" id="winner" name="winner" required>
            <div class="invalid-feedback" th:text="#{validation.required}">Required</div>
        </div>

        <div class="col-12">
            <label class="form-label" th:text="#{addBattle.label.characters}">Characters:</label>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-2">
                <div class="col" th:each="character : ${allCharacters}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               name="characterIds" th:value="${character.id}"
                               th:id="${'char-' + character.id}">
                        <label class="form-check-label" th:for="${'char-' + character.id}"
                               th:text="${character.name}">name</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> <span th:text="#{button.add}">Add</span>
            </button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
