<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{history.title})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <h1 class="mb-4" th:text="#{history.heading}">Session history</h1>

    <div class="alert alert-info" th:if="${#lists.isEmpty(visits)}" th:text="#{history.empty}">
        No pages visited yet.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(visits)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th th:text="#{history.table.page}">Page</th>
                <th th:text="#{history.table.time}">Visited at</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="visit : ${visits}">
                <td th:text="${visit.path}"></td>
                <td th:text="${#temporals.format(visit.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted fst-italic" th:text="#{history.count(${#lists.size(visits)})}">Number of visits: 0</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
